# 2026-07-24

# vitepress.dev/guide/deploy
# Deploy Your VitePress Site

# vitepress.dev/zh/guide/deploy
# 部署 VitePress 站点

# GitHub Pages

# Sample workflow for building and deploying a VitePress site to GitHub Pages
# 构建 VitePress 站点并将其部署到 GitHub Pages 的示例工作流程
#
name: Deploy VitePress site to Pages

on:
  # Runs on pushes targeting the main branch. Change this to master if you're
  # using the `master` branch as the default branch.
  # 在针对 main 分支的推送上运行。如果你
  # 使用 maste 分支作为默认分支，请将其更改为 master
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  # 允许你从 Actions 选项卡手动运行此工作流程
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
# 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
# 只允许同时进行一次部署，跳过正在运行和最新队列之间的运行队列
# 但是，不要取消正在进行的运行，因为我们希望允许这些生产部署完成
concurrency:
  group: pages
  cancel-in-progress: false


jobs:
  # Build job
  # 构建工作
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Not needed if lastUpdated is not enabled
          # 如果未启用 lastUpdated，则不需要
          fetch-depth: 0
      # Uncomment this block if you're using pnpm
      # 如果使用 pnpm，请取消此区域注释
      # - uses: pnpm/action-setup@v4 
      #   with:
      # Not needed if you've set "packageManager" in package.json
      #     version: 9
      # Uncomment this if you're using Bun
      # 如果使用 Bun，请取消注释
      # - uses: oven-sh/setup-bun@v1
      
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          # npm / pnpm / yarn
          cache: npm

      - name: Cache VitePress
        uses: actions/cache@v4
        with:
          path: docs/.vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('docs/**', 'package-lock.json', 'pnpm-lock.yaml', 'yarn.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-  
  
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Install dependencies
        # npm ci / pnpm install / yarn install / bun install
        run: npm ci
        
      - name: Build with VitePress
        # npm run docs:build / pnpm docs:build / yarn docs:build / bun run docs:build
        run: npm run docs:build
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist
          
  # Deployment job
  # 部署工作
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4